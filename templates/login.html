<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso administrativo | MERCON</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<header class="topbar">
    <a class="brand" href="/">MERCON<span>.</span></a>
    <span class="topbar-caption">ÁREA RESTRITA</span>
</header>
<main class="auth-wrap">
    <section class="form-card auth-card">
        <span class="eyebrow">MERCON · ADMINISTRAÇÃO</span>
        <h1>Entrar no painel</h1>
        <p class="muted">Acesso exclusivo à equipe autorizada.</p>
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% for categoria, mensagem in mensagens %}
                <div class="alert alert-{{ categoria }}" role="status">{{ mensagem }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <label for="usuario">Usuário</label>
            <input id="usuario" name="usuario" type="text" autocomplete="username" required>
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <button class="button button-primary button-full" type="submit">Acessar painel</button>
        </form>
        <a class="back-link" href="/">← Voltar ao portal</a>
    </section>
</main>
</body>
</html>
